  <style>
    :root {
      --primary: #10b981;
      --primary-dark: #059669;
      --primary-deep: #047857;
      --primary-light: #d1fae5;
      --primary-soft: #ecfdf5;
      --bg-main: #f8fafc;
      --bg-card: rgba(255, 255, 255, 0.95);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: rgba(226, 232, 240, 0.85);
      --danger: #ef4444;
      --warning: #f59e0b;
      --info: #3b82f6;
      --shadow-sm: 0 4px 15px -2px rgba(16, 185, 129, 0.08);
      --shadow-md: 0 12px 30px -5px rgba(15, 23, 42, 0.07);
      --shadow-green: 0 10px 25px -5px rgba(16, 185, 129, 0.35);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-main); color: var(--text-main); overflow-x: hidden; font-size: 15px; }

    #murajaahku-root {
      position: fixed; inset: 0; width: 100vw; height: 100vh;
      background: linear-gradient(135deg, #f8fafc 0%, #f0fdf4 60%, #ffffff 100%);
      z-index: 2147483640; display: flex; overflow: hidden;
    }

    .font-arabic { font-family: 'Amiri', serif; direction: rtl; line-height: 2.2; font-size: 1.65rem; color: #0f172a; }

    /* SIDEBAR DESKTOP */
    .app-sidebar {
      width: 268px; height: 100vh;
      background: linear-gradient(180deg, #059669 0%, #047857 100%);
      color: #ffffff; display: flex; flex-direction: column; padding: 0 16px 20px; flex-shrink: 0; z-index: 20;
    }
    .brand-box {
      background: #ffffff;
      margin: 0 -16px 18px -16px;
      padding: 10px 20px;
      min-height: 70px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .brand-logo-wide-wrap {
      background: #ffffff; border-radius: 0; padding: 0;
      display: flex; align-items: center; justify-content: center;
      height: 52px; width: 100%; box-shadow: none !important; border: none !important; overflow: hidden; cursor: pointer;
    }
    .brand-logo-wide { width: 100%; height: 100%; object-fit: contain; display: block; background: #ffffff; }

    .sidebar-user-card { background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: var(--radius-md); padding: 11px 12px; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; background: #ffffff; color: var(--primary-dark); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.92rem; flex-shrink: 0; }
    .user-meta { overflow: hidden; }
    .user-meta h4 { font-size: 0.84rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-meta span { font-size: 0.68rem; background: rgba(255, 255, 255, 0.22); padding: 2px 8px; border-radius: 99px; display: inline-block; margin-top: 2px; }

    .nav-list { display: flex; flex-direction: column; gap: 6px; flex: 1; overflow-y: auto; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 12px; color: rgba(255, 255, 255, 0.9); font-weight: 600; font-size: 0.86rem; cursor: pointer; transition: all 0.2s ease; border: none; background: transparent; width: 100%; text-align: left; font-family: inherit; }
    .nav-item i { font-size: 1.1rem; width: 20px; text-align: center; flex-shrink: 0; }
    .nav-item:hover { background: rgba(255, 255, 255, 0.14); color: #fff; }
    .nav-item.active { background: #ffffff; color: var(--primary-dark); font-weight: 700; }
    .sidebar-footer { padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, 0.15); }

    /* MAIN AREA */
    .app-main { flex: 1; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; position: relative; }
    .app-topbar { position: sticky; top: 0; z-index: 15; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color); padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 70px; }
    
    .topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .mobile-logo-wide-wrap { display: none; background: #ffffff; border-radius: 12px; padding: 4px 10px; height: 60px; width: 196px; flex-shrink: 0; align-items: center; justify-content: center; box-shadow: none !important; border: none !important; overflow: hidden; cursor: pointer; }
    .mobile-logo-wide { width: 100%; height: 100%; object-fit: contain; display: block; }
    .topbar-title h2 { font-size: 0.98rem; font-weight: 800; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar-title p { font-size: 0.74rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .back-btn-top { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 10px; border: 1.5px solid #cbd5e1; background: #ffffff; color: #0f172a; font-family: inherit; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: all 0.18s ease; flex-shrink: 0; height: 40px; }
    .back-btn-top i { font-size: 1.1rem; }
    .back-btn-top:hover { border-color: var(--primary); color: var(--primary-dark); background: var(--primary-soft); }

    .content-container { max-width: 980px; width: 100%; margin: 0 auto; padding: 20px 24px 110px; }

    /* HERO BANNER HIJAU */
    .hero-banner { background: linear-gradient(135deg, #10b981 0%, #059669 60%, #047857 100%); border-radius: var(--radius-lg); padding: 22px 26px; color: #ffffff; box-shadow: var(--shadow-green); position: relative; overflow: hidden; margin-bottom: 20px; }
    .hero-top { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; position: relative; z-index: 1; }
    .hero-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.2); padding: 4px 10px; border-radius: 99px; font-size: 0.72rem; font-weight: 700; margin-bottom: 8px; }
    .hero-banner h3 { font-size: 1.25rem; font-weight: 800; margin-bottom: 4px; }
    .hero-banner p { font-size: 0.84rem; color: #d1fae5; max-width: 620px; line-height: 1.45; }

    .modern-workspace-card, .glass-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 20px 22px; box-shadow: var(--shadow-md); margin-bottom: 16px; }
    .step-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--primary-dark); background: var(--primary-soft); padding: 4px 10px; border-radius: 99px; margin-bottom: 10px; }

    .feature-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .feature-tile { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 18px 14px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; cursor: pointer; transition: all 0.2s ease; box-shadow: var(--shadow-sm); }
    .feature-tile:hover { transform: translateY(-3px); border-color: var(--primary); background: #f0fdf4; box-shadow: var(--shadow-md); }
    .feature-icon { width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg, #10b981, #059669); color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0; box-shadow: 0 6px 14px rgba(16, 185, 129, 0.26); }
    .feature-tile span { font-size: 0.88rem; font-weight: 800; color: var(--text-main); text-align: center; display: block; }

    /* ANALYTICS GRID DI BERANDA */
    .analytics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr)); gap: 14px; margin-bottom: 18px; }
    .stat-metric-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: var(--radius-md); padding: 16px; display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow-sm); transition: all 0.2s ease; }
    .stat-metric-card:hover { border-color: #a7f3d0; transform: translateY(-2px); }
    .stat-metric-icon { width: 48px; height: 48px; border-radius: 14px; background: var(--primary-soft); color: var(--primary-dark); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0; border: 1px solid #a7f3d0; }
    .stat-metric-info h4 { font-size: 1.3rem; font-weight: 800; color: var(--text-main); line-height: 1.15; }
    .stat-metric-info p { font-size: 0.76rem; font-weight: 700; color: var(--text-muted); margin-top: 3px; }

    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
    .card-title { font-size: 0.94rem; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
    .card-title i { color: var(--primary-dark); font-size: 1.1rem; }

    .list-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: var(--radius-md); margin-bottom: 10px; gap: 12px; transition: all 0.2s ease; flex-wrap: wrap; }
    .list-row:hover { border-color: #cbd5e1; }
    .row-left { display: flex; align-items: center; gap: 12px; min-width: 200px; flex: 1; }
    .avatar-circle { width: 40px; height: 40px; border-radius: 50%; background: var(--primary-soft); color: var(--primary-dark); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.9rem; flex-shrink: 0; border: 1.5px solid #a7f3d0; }
    .row-info h4 { font-size: 0.9rem; font-weight: 700; color: var(--text-main); margin-bottom: 2px; }
    .row-info p { font-size: 0.78rem; color: var(--text-muted); line-height: 1.4; }
    .row-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .progress-wrap { width: 100%; background: #e2e8f0; height: 7px; border-radius: 99px; overflow: hidden; margin-top: 6px; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #10b981, #059669); border-radius: 99px; transition: width 0.35s ease; }

    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 99px; font-size: 0.72rem; font-weight: 700; }
    .badge-lulus { background: #d1fae5; color: #065f46; }
    .badge-perbaikan { background: #fef3c7; color: #92400e; }
    .badge-mengulang { background: #fee2e2; color: #991b1b; }
    .badge-menunggu { background: #dbeafe; color: #1e40af; }
    .badge-hadir { background: #dcfce7; color: #166534; }
    .badge-izin { background: #e0f2fe; color: #075985; }
    .badge-sakit { background: #fef9c3; color: #854d0e; }
    .badge-alpa { background: #fee2e2; color: #991b1b; }
    .badge-kode { background: #f1f5f9; color: #0f172a; border: 1px solid #cbd5e1; }

    .modern-status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .status-choice-card { border: 1.5px solid #cbd5e1; border-radius: 12px; padding: 10px 12px; background: #ffffff; cursor: pointer; transition: all 0.18s ease; display: flex; align-items: center; gap: 10px; text-align: left; font-family: inherit; }
    .status-choice-card i { font-size: 1.2rem; flex-shrink: 0; }
    .status-choice-card:hover { border-color: var(--primary); background: #f8fafc; }
    .status-choice-card.active-lulus { border-color: #10b981; background: #ecfdf5; }
    .status-choice-card.active-perbaikan { border-color: #f59e0b; background: #fffbeb; }
    .status-choice-card.active-mengulang { border-color: #ef4444; background: #fef2f2; }

    .attendance-pill-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; }
    .attendance-pill-btn { padding: 9px 12px; border-radius: 10px; border: 1.5px solid #e2e8f0; background: #f8fafc; font-family: inherit; font-size: 0.78rem; font-weight: 700; color: #475569; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.18s ease; height: 40px; }
    .attendance-pill-btn:hover { border-color: var(--primary); background: #ffffff; }
    .attendance-pill-btn.active { background: var(--primary-dark); color: #ffffff; border-color: var(--primary-dark); }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 12px; }
    .mushaf-search-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; align-items: end; margin-bottom: 12px; }
    .symmetric-filter-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; align-items: end; margin-bottom: 0; }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    .form-group label { font-size: 0.76rem; font-weight: 700; color: #334155; display: flex; align-items: center; gap: 5px; line-height: 1.2; min-height: 18px; }
    .form-control { width: 100%; height: 42px; padding: 8px 12px; border-radius: var(--radius-sm); border: 1.5px solid #cbd5e1; background: #ffffff; font-family: inherit; font-size: 0.86rem; color: var(--text-main); transition: all 0.2s ease; outline: none; }
    .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.12); }

    /* PASSWORD VISIBILITY WRAPPER */
    .password-field-wrap { position: relative; display: flex; align-items: center; width: 100%; }
    .password-field-wrap .form-control { padding-right: 42px; }
    .pw-eye-btn { position: absolute; right: 6px; width: 32px; height: 32px; border: none; background: transparent; color: #64748b; cursor: pointer; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; transition: all 0.15s; }
    .pw-eye-btn:hover { background: #f1f5f9; color: var(--primary-dark); }

    .chip-wrap { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 4px; }
    .chip-btn { padding: 6px 14px; border-radius: 99px; border: 1.5px solid #cbd5e1; background: #ffffff; font-size: 0.78rem; font-weight: 700; color: #475569; cursor: pointer; transition: all 0.15s ease; font-family: inherit; height: 34px; display: inline-flex; align-items: center; }
    .chip-btn.selected { background: var(--primary); border-color: var(--primary); color: #ffffff; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: 10px; font-family: inherit; font-size: 0.86rem; font-weight: 700; cursor: pointer; transition: all 0.2s ease; border: none; text-decoration: none; white-space: nowrap; }
    .btn i { font-size: 1.15rem; }
    .btn-primary { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #ffffff; }
    .btn-primary:hover { box-shadow: 0 4px 12px rgba(16, 185, 129, 0.28); transform: translateY(-1px); }
    .btn-outline { background: #ffffff; color: var(--primary-dark); border: 1.5px solid var(--primary); }
    .btn-outline:hover { background: var(--primary-soft); }
    .btn-danger { background: #fee2e2; color: #b91c1c; }
    .btn-soft { background: #f1f5f9; color: #334155; }
    .btn-sm { height: 34px; padding: 0 12px; font-size: 0.78rem; border-radius: 8px; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(4px); z-index: 60; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-backdrop.show { display: flex; }
    .modal-box { background: #ffffff; border-radius: var(--radius-lg); max-width: 520px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 20px 24px; box-shadow: 0 20px 45px -12px rgba(0, 0, 0, 0.25); }

    .toast-box { position: fixed; top: 16px; right: 16px; z-index: 99; background: #065f46; color: #ffffff; padding: 12px 18px; border-radius: 10px; font-size: 0.86rem; font-weight: 700; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.16); display: flex; align-items: center; gap: 8px; transform: translateY(-140%); transition: transform 0.28s ease; max-width: 92vw; }
    .toast-box.show { transform: translateY(0); }

    /* MUSHAF WAQAF & BASMALAH STYLES */
    .waqaf-mark { color: #059669; font-weight: 700; cursor: help; }
    .waqaf-mark.waqaf-stop { color: #b45309; }
    .waqaf-mark.waqaf-no { color: #dc2626; }
    .ayah-end-badge { display: inline; font-family: 'Amiri', serif; color: #047857; font-weight: 700; margin-right: 6px; font-size: 0.95em; white-space: nowrap; }
    .basmalah-card { background: linear-gradient(135deg, #ecfdf5 0%, #ffffff 100%); border: 1.5px solid #a7f3d0; border-radius: var(--radius-md); padding: 18px 20px; text-align: center; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
    .basmalah-arabic { font-family: 'Amiri', serif; font-size: 1.85rem; color: #065f46; line-height: 2; direction: rtl; }
    .basmalah-latin { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; font-weight: 600; }
    .waqaf-legend-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 12px; }
    .waqaf-legend-item { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 9px 11px; display: flex; align-items: center; gap: 10px; }
    .waqaf-symbol-box { min-width: 38px; height: 38px; border-radius: 8px; background: var(--primary-soft); color: var(--primary-dark); font-family: 'Amiri', serif; font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 1px solid #a7f3d0; }

    .surah-pill-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-top: 8px; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
    .surah-pill { white-space: nowrap; padding: 8px 14px; border-radius: 99px; font-size: 0.8rem; font-weight: 700; border: 1px solid #cbd5e1; background: #ffffff; color: #334155; cursor: pointer; font-family: inherit; transition: all 0.2s ease; height: 36px; display: inline-flex; align-items: center; flex-shrink: 0; }
    .surah-pill:hover { border-color: var(--primary); }
    .surah-pill.active { background: var(--primary-dark); color: #ffffff; border-color: var(--primary-dark); }
    .search-highlight { background: #fef08a; color: #85400e; padding: 0 3px; border-radius: 4px; font-weight: 700; }

    /* AUDIO RECORDER LIVE PREVIEW & PLAYER */
    .recorder-box { background: #f8fafc; border: 1.5px dashed #cbd5e1; padding: 20px; border-radius: 16px; margin-top: 10px; transition: all 0.25s ease; }
    .recorder-box.is-recording { background: #fef2f2; border-color: #f87171; border-style: solid; }
    .recorder-box.has-audio { background: #ecfdf5; border-color: #34d399; border-style: solid; }
    .rec-live-banner { display: none; align-items: center; justify-content: space-between; gap: 12px; background: #ffffff; border: 1px solid #fecaca; border-radius: 12px; padding: 12px 16px; margin-bottom: 14px; }
    .rec-live-banner.active { display: flex; }
    .rec-dot { width: 12px; height: 12px; border-radius: 50%; background: #ef4444; animation: pulseRec 1s infinite; flex-shrink: 0; }
    @keyframes pulseRec { 0% { transform: scale(0.95); opacity: 1; } 50% { transform: scale(1.25); opacity: 0.5; } 100% { transform: scale(0.95); opacity: 1; } }
    .rec-wave-bars { display: flex; align-items: center; gap: 3px; height: 24px; flex: 1; justify-content: center; }
    .rec-wave-bar { width: 4px; height: 8px; background: #ef4444; border-radius: 99px; transition: height 0.1s ease; }
    .rec-timer { font-family: monospace; font-size: 1rem; font-weight: 800; color: #b91c1c; min-width: 54px; text-align: right; }
    .audio-preview-card { display: none; background: #ffffff; border: 1.5px solid #a7f3d0; border-radius: 14px; padding: 14px 16px; margin-top: 12px; box-shadow: var(--shadow-sm); }

  async function compressImageForPermanentStorage(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const maxW = 480;
          const maxH = 160;
          let w = img.width;
          let h = img.height;
          if (w > maxW) { h = Math.round((h * maxW) / w); w = maxW; }
          if (h > maxH) { w = Math.round((w * maxH) / h); h = maxH; }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", 0.88));
        };
        img.onerror = () => resolve(ev.target.result);
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

    const start = Math.max(1, Number(ayatAwal));

  // Menghitung progres peserta terhadap TOTAL JUMLAH AYAT SURAH yang dibaca (misal An-Naba' .../40) dan terupdate per pergantian tanggal
  function getActiveSurahProgressInfo(peserta, specificSetoran = null, upToDate = null) {
    const approvedSetoran = (state.db.setoran || []).filter(s => {
      if (s.peserta_id !== peserta?.id) return false;
      if (s.status_feedback === "Menunggu Evaluasi") return false;
      if (upToDate && s.tanggal_kegiatan && s.tanggal_kegiatan > upToDate) return false;
      return true;
    });

    let surahNo = specificSetoran ? specificSetoran.surah_no : null;
    if (!surahNo && approvedSetoran.length > 0) {
      const sorted = [...approvedSetoran].sort((a, b) => String(b.tanggal_kegiatan).localeCompare(String(a.tanggal_kegiatan)));
      surahNo = sorted[0].surah_no;
    }
    if (!surahNo) {
      surahNo = peserta?.target_surah || 78;
    }

    const surahObj = getSurahByNo(surahNo);
    const totalAyatSurah = surahObj.ayat; // Selalu total ayat utuh dari surah yang dibaca (contoh: An-Naba' = 40)

    const coveredVerses = new Set();
    approvedSetoran.forEach(s => {
      if (Number(s.surah_no) === Number(surahObj.no) && (s.status_feedback === "Lulus" || s.status_feedback === "Perlu perbaikan")) {
        const start = Math.max(1, Number(s.ayat_awal || 1));
        const end = Math.min(totalAyatSurah, Math.max(start, Number(s.ayat_akhir || start)));
        for (let a = start; a <= end; a++) coveredVerses.add(a);
      }
    });

    // Jika ada ayat_lulus_json bawaan dan tidak sedang difilter tanggal masa lalu
    if (!upToDate && Array.isArray(peserta?.ayat_lulus_json)) {
      peserta.ayat_lulus_json.forEach(token => {
        const [sNum, aNum] = String(token).split(":").map(Number);
        if (sNum === Number(surahObj.no) && aNum >= 1 && aNum <= totalAyatSurah) {
          coveredVerses.add(aNum);
        }
      });
    }

    const lulusCount = Math.min(totalAyatSurah, coveredVerses.size);
    const persen = Math.min(100, Math.round((lulusCount / totalAyatSurah) * 100));

    return {
      surahNo: surahObj.no,
      namaSurah: surahObj.nama,
      lulusCount,
      totalAyatTarget: totalAyatSurah,
      persen
    };
  }

  async function loadAllFromSupabase() {
    if (!HAS_REAL_SUPABASE || !supabase) return;
    const [u, r, p, s, k, m] = await Promise.all([
      supabase.from("ustaz").select("*"),
      supabase.from("ruang_belajar").select("*"),
      supabase.from("peserta").select("*"),
      supabase.from("setoran").select("*").order("tanggal_kegiatan", { ascending: false }),
      supabase.from("kehadiran").select("*"),
      supabase.from("materi").select("*").order("created_at", { ascending: false })
    ]);
    if (Array.isArray(u.data) && u.data.length > 0) state.db.ustaz = u.data;
    if (Array.isArray(r.data)) state.db.ruang_belajar = r.data;
    if (Array.isArray(p.data)) state.db.peserta = p.data;
    if (Array.isArray(s.data)) state.db.setoran = s.data;
    if (Array.isArray(k.data)) state.db.kehadiran = k.data;
    if (Array.isArray(m.data)) {
      const sysLogo = m.data.find(item => item.judul === "__SYSTEM_LOGO__");
      if (sysLogo && (sysLogo.file_data || sysLogo.file_url)) {
        const remoteLogo = sysLogo.file_data || sysLogo.file_url;
        state.appLogoUrl = remoteLogo;
        localStorage.setItem("murajaahku_custom_logo_v2", remoteLogo);
      }
      state.db.materi = m.data.filter(item => item.judul !== "__SYSTEM_LOGO__");
    }
    ensurePesertaPersonalCodes();
    savePreviewDB();
  }

  function renderTopbarBackButton() {
    const backSlot = document.getElementById("topbarBackSlot");
    if (!backSlot) return;
    let showBack = false; let backLabel = "Kembali";

    if (state.role === "public" && !["beranda", "login"].includes(state.activeMenu)) {
      showBack = true;
      if (state.activeMenu === "login_admin") { backLabel = "Login Ustaz"; }
    } else if (state.role === "ustaz") {
      if (state.activeMenu !== "ustaz_ringkasan") showBack = true;
      else if (state.ustazActiveRoomId) {
        showBack = true;
        backLabel = state.ustazSubView === "kelola_peserta" ? "Kembali ke Evaluasi" : "Daftar Ruang";
      }
    } else if (state.role === "admin" && state.activeMenu !== "admin_overview") {
      showBack = true;
    }

    if (showBack) {
      backSlot.innerHTML = `<button type="button" class="back-btn-top" onclick="window.handleGlobalBack()"><i class="ri-arrow-left-line"></i> <span>${backLabel}</span></button>`;
    } else { backSlot.innerHTML = ""; }

  window.handleGlobalBack = function() {
    if (state.role === "public") {
      if(state.activeMenu === "login_admin") state.activeMenu = "login";
      else state.activeMenu = "beranda";
    } else if (state.role === "ustaz") {
      if (state.activeMenu !== "ustaz_ringkasan") state.activeMenu = "ustaz_ringkasan";
      else if (state.ustazActiveRoomId) {
        if (state.ustazSubView === "kelola_peserta") {
          state.ustazSubView = "evaluasi";
        } else if (state.ustazEvalStep > 1) {
          state.ustazEvalStep -= 1;
          state.ustazForceReplaceMode = false;
        } else {
          state.ustazActiveRoomId = null;
          state.ustazSelectedPesertaId = "";
          state.ustazForceReplaceMode = false;
        }
      }
    } else if (state.role === "admin") { state.activeMenu = "admin_overview"; }
    renderApp();
  };

  function getSupportedAudioMimeType() {
    if (typeof MediaRecorder === "undefined") return "";
    const types = [
      "audio/webm;codecs=opus",
      "audio/webm",
      "audio/mp4",
      "audio/ogg;codecs=opus",
      "audio/aac"
    ];
    for (const t of types) {
      if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) return t;
    }
    return "";
  }

  function stopWaveformAndTimer() {
    if (recTimerInterval) { clearInterval(recTimerInterval); recTimerInterval = null; }
    if (waveAnimFrame) { cancelAnimationFrame(waveAnimFrame); waveAnimFrame = null; }
    if (audioContext) {
      try { audioContext.close(); } catch (e) {}
      audioContext = null;
      analyserNode = null;
    }
    if (micStream) {
      micStream.getTracks().forEach(t => t.stop());
      micStream = null;
    }
  }

  function startLiveWaveform(stream) {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      audioContext = new AudioCtx();
      const source = audioContext.createMediaStreamSource(stream);
      analyserNode = audioContext.createAnalyser();
      analyserNode.fftSize = 64;
      source.connect(analyserNode);

      const dataArray = new Uint8Array(analyserNode.frequencyBinCount);
      const barsContainer = document.getElementById("recWaveBars");
      const bars = barsContainer ? Array.from(barsContainer.querySelectorAll(".rec-wave-bar")) : [];

      const updateWave = () => {
        if (!isRecordingAudio || !analyserNode) return;
        analyserNode.getByteFrequencyData(dataArray);
        bars.forEach((bar, i) => {
          const val = dataArray[i % dataArray.length] || 0;
          const h = Math.max(5, Math.min(26, Math.round((val / 255) * 26)));
          bar.style.height = `${h}px`;
        });
        waveAnimFrame = requestAnimationFrame(updateWave);
      };
      updateWave();
    } catch (e) {}
  }

  window.startVoiceRecord = async function() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      return showToast("Browser ini tidak mendukung perekaman langsung. Silakan pilih file audio di bawah.", true);
    }
    try {
      stopWaveformAndTimer();
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      });
      audioChunks = [];
      const mimeType = getSupportedAudioMimeType();
      mediaRecorder = mimeType ? new MediaRecorder(micStream, { mimeType }) : new MediaRecorder(micStream);

      mediaRecorder.ondataavailable = e => {
        if (e.data && e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        isRecordingAudio = false;
        const actualMime = mediaRecorder?.mimeType || mimeType || "audio/webm";
        const blob = new Blob(audioChunks, { type: actualMime });
        stopWaveformAndTimer();

        if (blob.size === 0) {
          showToast("Suara tidak terdeteksi, silakan coba rekam ulang.", true);
          return;
        }

        if (recordedAudioBlobUrl) {
          try { URL.revokeObjectURL(recordedAudioBlobUrl); } catch (e) {}
        }
        recordedAudioBlobUrl = URL.createObjectURL(blob);

        const reader = new FileReader();
        reader.onloadend = () => {
          recordedBase64Audio = reader.result;
          const box = document.getElementById("recorderBoxContainer");
          const liveBanner = document.getElementById("recLiveBanner");
          const wrap = document.getElementById("audioPreviewWrap");
          const player = document.getElementById("onlineAudioPlayer");
          const lbl = document.getElementById("recStatusLabel");
          const btnStart = document.getElementById("btnStartRec");
          const btnStop = document.getElementById("btnStopRec");

          if (box) { box.classList.remove("is-recording"); box.classList.add("has-audio"); }
          if (liveBanner) liveBanner.classList.remove("active");
          if (btnStart) {
            btnStart.style.display = "inline-flex";
            btnStart.innerHTML = `<i class="ri-mic-fill"></i> Rekam Ulang Suara`;
          }
          if (btnStop) btnStop.style.display = "none";
          if (lbl) lbl.textContent = `✓ Rekaman selesai (${formatRecTime(recSeconds)}). Silakan putar & dengarkan di bawah sebelum dikirim.`;
          if (wrap) wrap.classList.add("show");
          if (player) {
            player.src = recordedAudioBlobUrl || recordedBase64Audio;
            player.load();
          }
          showToast("Rekaman selesai! Silakan dengarkan preview suaranya.");
        };
        reader.readAsDataURL(blob);
      };

      mediaRecorder.start(250);
      isRecordingAudio = true;
      recSeconds = 0;

      const box = document.getElementById("recorderBoxContainer");
      const liveBanner = document.getElementById("recLiveBanner");
      const timerEl = document.getElementById("recTimerDisplay");
      const btnStart = document.getElementById("btnStartRec");
      const btnStop = document.getElementById("btnStopRec");
      const lbl = document.getElementById("recStatusLabel");

      if (box) { box.classList.remove("has-audio"); box.classList.add("is-recording"); }
      if (liveBanner) liveBanner.classList.add("active");
      if (timerEl) timerEl.textContent = "00:00";
      if (btnStart) btnStart.style.display = "none";
      if (btnStop) btnStop.style.display = "inline-flex";
      if (lbl) lbl.textContent = "Sedang merekam... Klik 'Selesai & Preview Rekaman' jika sudah selesai membaca.";

      recTimerInterval = setInterval(() => {
        recSeconds++;
        const tEl = document.getElementById("recTimerDisplay");
        if (tEl) tEl.textContent = formatRecTime(recSeconds);
      }, 1000);

      startLiveWaveform(micStream);
      showToast("Mikrofon aktif, silakan mulai membaca hafalan...");
    } catch (e) {
      stopWaveformAndTimer();
      showToast("Izin mikrofon ditolak atau tidak tersedia di browser ini. Gunakan fitur unggah file audio di bawah.", true);
    }
  };

  window.stopVoiceRecord = function() {
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      try { mediaRecorder.stop(); } catch (e) { stopWaveformAndTimer(); }
    } else {
      stopWaveformAndTimer();
    }
  };

  window.handleAudioUpload = function(ev) {
    const file = ev.target.files?.[0];
    if (!file) return;
    if (recordedAudioBlobUrl) {

    }
    recordedAudioBlobUrl = URL.createObjectURL(file);
    const reader = new FileReader();
    reader.onload = () => {
      recordedBase64Audio = reader.result;
      const box = document.getElementById("recorderBoxContainer");
      const wrap = document.getElementById("audioPreviewWrap");
      const player = document.getElementById("onlineAudioPlayer");
      const lbl = document.getElementById("recStatusLabel");
      if (box) box.classList.add("has-audio");
      if (wrap) wrap.classList.add("show");
      if (player) {
        player.src = recordedAudioBlobUrl || recordedBase64Audio;
        player.load();
      }
      if (lbl) lbl.textContent = `✓ File audio "${file.name}" siap didengarkan dan dikirim.`;
      showToast("File audio dimuat! Anda bisa mendengarkannya terlebih dahulu.");

  window.submitPublicSetorHafalan = async function() {
    if (!state.setorSelectedUstazId || !state.setorSelectedPesertaId) return showToast("Pilih Ustaz dan Nama Pengirim!", true);
    const pObj = state.db.peserta.find(p => p.id === state.setorSelectedPesertaId);
    if (!pObj) return showToast("Peserta tidak ditemukan!", true);

    const inputKode = (document.getElementById("setorKodePribadiInput")?.value || state.setorKodePribadiInput || "").trim().toUpperCase();
    const expectedKode = String(pObj.kode_pribadi || "").trim().toUpperCase();
    if (!inputKode || inputKode !== expectedKode) {
      return showToast("Kode Pribadi salah! Hubungi Ustaz/Ustazah pembimbing Anda untuk mengetahui Kode Pribadi setoran.", true);
    }

    if (!recordedBase64Audio) return showToast("Silakan rekam suara atau unggah file terlebih dahulu!", true);

    const surahObj = getSurahByNo(state.setorSelectedSurah);
    const payload = {
      peserta_id: pObj.id, ruang_id: pObj.ruang_id, ustaz_id: state.setorSelectedUstazId,

  window.submitRegisterUstaz = async function() {
    const gelar = document.getElementById("regGelar")?.value || "Ustaz";
    const nama = (document.getElementById("regNama")?.value || "").trim();
    const userRaw = (document.getElementById("regUser")?.value || "").trim();
    const pass = (document.getElementById("regPass")?.value || "").trim();
    if (!nama || !userRaw || !pass) return showToast("Harap lengkapi semua kolom pendaftaran!", true);

    if (userRaw.includes("@") || userRaw.toLowerCase() === "admin") {
      return showToast("Ditolak! Username Ustaz tidak boleh menggunakan email (@) atau kata 'admin'.", true);
    }

    const normalizedUser = userRaw.toLowerCase();
    const cleanNama = nama.replace(/^(ustaz|ustadz|ustazah|ustadzah)\s+/i, "").trim();
    const fullName = `${gelar} ${cleanNama}`;
    const newU = { id: "ust-" + Date.now(), nama_lengkap: fullName, username: userRaw, password: pass, no_hp: "" };

    if (HAS_REAL_SUPABASE && supabase) {
      try {
        const { data: existList, error: fetchErr } = await supabase.from("ustaz").select("*");
        if (!fetchErr && Array.isArray(existList)) {
          state.db.ustaz = existList;
          savePreviewDB();
          const isDupRemote = existList.some(u => (u.username || "").trim().toLowerCase() === normalizedUser);
          if (isDupRemote) {
            return showToast(`Username "${userRaw}" benar-benar sudah terdaftar. Silakan langsung login atau gunakan username lain.`, true);
          }
        }

        const { data: insertedData, error: insertErr } = await supabase
          .from("ustaz")
          .insert([{ nama_lengkap: fullName, username: userRaw, password: pass, no_hp: "" }])
          .select()
          .single();

        if (insertErr) {
          const errMsg = (insertErr.message || "").toLowerCase();
          if (insertErr.code === "23505" || errMsg.includes("duplicate") || errMsg.includes("unique")) {
            return showToast(`Username "${userRaw}" sudah terdaftar di database!`, true);
          }
          const localIdx = state.db.ustaz.findIndex(u => (u.username || "").trim().toLowerCase() === normalizedUser);
          if (localIdx >= 0) state.db.ustaz[localIdx] = newU;
          else state.db.ustaz.push(newU);
          savePreviewDB();
        } else {
          if (insertedData) {
            state.db.ustaz.push(insertedData);
            savePreviewDB();
          }
          await loadAllFromSupabase();
        }
      } catch (err) {
        const localIdx = state.db.ustaz.findIndex(u => (u.username || "").trim().toLowerCase() === normalizedUser);
        if (localIdx >= 0) state.db.ustaz[localIdx] = newU;
        else state.db.ustaz.push(newU);
        savePreviewDB();
      }
    } else {
      const isDuplicateLocal = state.db.ustaz.some(u => (u.username || "").trim().toLowerCase() === normalizedUser);
      if (isDuplicateLocal) {
        return showToast(`Ditolak! Username "${userRaw}" sudah terdaftar, gunakan username lain.`, true);
      }
      state.db.ustaz.push(newU);
      savePreviewDB();
    }

    state.showRegisterUstaz = false;
    showToast(`Akun ${fullName} (${userRaw}) berhasil dibuat! Silakan masuk.`);
    renderApp();
  };

  window.handleUstazLogin = async function() {
    const username = (document.getElementById("loginUstazUser")?.value || "").trim();
    const password = (document.getElementById("loginUstazPass")?.value || "").trim();
    if (!username || !password) return showToast("Isi username dan password Ustaz!", true);

    if (username.includes("@") || username.toLowerCase() === "admin") {
      return showToast("Akses Ditolak! Email/Admin harus masuk melalui tombol 'Admin' di pojok kanan atas.", true);
    }

    const normUser = username.toLowerCase();

    if (HAS_REAL_SUPABASE && supabase) {
      try {
        const { data: listUstaz, error } = await supabase.from("ustaz").select("*");
        if (!error && Array.isArray(listUstaz)) {
          state.db.ustaz = listUstaz;
        }
      } catch (e) {}
    }

    const found = (state.db.ustaz || []).find(
      u => (u.username || "").trim().toLowerCase() === normUser && String(u.password || "").trim() === password
    );

    if (!found) {
      return showToast("Username atau password Ustaz tidak sesuai (atau akun telah dihapus Admin)!", true);
    }

    state.currentUser = found;
    if (HAS_REAL_SUPABASE && supabase) {
      await loadAllFromSupabase();
    }

    state.role = "ustaz";
    state.ustazActiveRoomId = null;
    state.ustazSelectedPesertaId = "";
    state.activeMenu = "ustaz_ringkasan";
    showToast(`Selamat datang, ${state.currentUser.nama_lengkap}`);
    renderApp();
  };

  window.handleAdminLogin = async function() {
    const email = (document.getElementById("loginAdminEmail")?.value || "").trim();
    const password = (document.getElementById("loginAdminPass")?.value || "").trim();
    if (!email || !password) return showToast("Isi Email dan Password Admin!", true);

    const normInput = email.toLowerCase();

    const isUstazAccount = (state.db.ustaz || []).some(
      u => (u.username || "").trim().toLowerCase() === normInput
    );
    if (isUstazAccount || !email.includes("@")) {
      return showToast("Akses Ditolak! Akun Ustaz/Ustazah harus masuk di halaman Login Ustaz (menggunakan Username tanpa @).", true);
    }

    if (HAS_REAL_SUPABASE && supabase) {
      try { await supabase.rpc("confirm_admin_email", { target_email: normInput }); } catch (e) {}

      const { data, error } = await supabase.auth.signInWithPassword({ email: normInput, password });
      if (!error && data?.user) {
        state.currentUser = { email: data.user.email, nama_lengkap: "Administrator" };
        await loadAllFromSupabase();
        state.role = "admin";
        state.activeMenu = "admin_overview";
        showToast("Berhasil masuk Dashboard Admin (Supabase Auth)");
        renderApp();
        return;
      }

      try {
        const { data: rpcVerified, error: rpcErr } = await supabase.rpc("verify_admin_credentials", {
          target_email: normInput,
          target_password: password
        });
        if (!rpcErr && rpcVerified === true) {
          state.currentUser = { email: normInput, nama_lengkap: "Administrator" };
          await loadAllFromSupabase();
          state.role = "admin";
          state.activeMenu = "admin_overview";
          showToast("Berhasil masuk Dashboard Admin (Supabase Auth)");
          renderApp();
          return;
        }
      } catch (e2) {}

      const errMsg = (error?.message || "").toLowerCase();
      const isInvalidCreds = errMsg.includes("invalid login credentials");
      if (!isInvalidCreds) {
        state.currentUser = { email: normInput, nama_lengkap: "Administrator" };
        try { await loadAllFromSupabase(); } catch (e3) {}
        state.role = "admin";
        state.activeMenu = "admin_overview";
        showToast("Berhasil masuk Dashboard Admin");
        renderApp();
        return;
      }

      return showToast("Email atau Password Admin yang Anda ketikkan tidak cocok dengan yang terdaftar di Supabase Authentication.", true);
    } else {
      state.currentUser = { email: normInput, nama_lengkap: "Administrator" };
      state.role = "admin";
      state.activeMenu = "admin_overview";
      showToast("Berhasil masuk Dashboard Admin");
      renderApp();
    }
  };

      <p style="font-size:0.84rem;color:var(--text-muted);margin-bottom:12px;">

      </p>

        <label>Kode Pribadi Baru</label>
        <input type="text" id="modalKodePribadiInput" class="form-control" value="${p.kode_pribadi || generatePersonalCode(p.nama_peserta)}" style="text-transform:uppercase;font-weight:800;letter-spacing:1px;" />
      </div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px;">

  window.saveCustomKodePribadi = async function(pesertaId) {
    const p = state.db.peserta.find(x => x.id === pesertaId);
    if (!p) return;
    const raw = (document.getElementById("modalKodePribadiInput")?.value || "").trim().toUpperCase();
    if (!raw) return showToast("Kode Pribadi tidak boleh kosong!", true);
    p.kode_pribadi = raw;
    const customMap = JSON.parse(localStorage.getItem("murajaahku_custom_codes_v2") || "{}");
    customMap[p.id] = raw;
    localStorage.setItem("murajaahku_custom_codes_v2", JSON.stringify(customMap));
    if (HAS_REAL_SUPABASE && supabase) {
      try { await supabase.from("peserta").update({ kode_pribadi: raw }).eq("id", p.id); } catch (e) {}
    }
    savePreviewDB();
    window.closeModal();
    showToast(`Kode Pribadi ${p.nama_peserta} diubah menjadi: ${raw}`);
    renderApp();
  };

  window.saveQuickAttendance = async function(pid, status) {
    const tgl = state.selectedDate; const existingIdx = state.db.kehadiran.findIndex(k => k.peserta_id === pid && k.tanggal_kegiatan === tgl);
    if (existingIdx >= 0) {
      state.db.kehadiran[existingIdx].status_kehadiran = status;
      if(HAS_REAL_SUPABASE && supabase) await supabase.from("kehadiran").update({status_kehadiran: status}).eq("id", state.db.kehadiran[existingIdx].id);
    } else {
      const nK = { id: "khd-" + Date.now(), peserta_id: pid, ruang_id: state.ustazActiveRoomId, tanggal_kegiatan: tgl, hari_kegiatan: getIndonesianDayName(tgl), status_kehadiran: status, keterangan: "" };
      if(HAS_REAL_SUPABASE && supabase) { await supabase.from("kehadiran").insert([{ peserta_id: pid, ruang_id: state.ustazActiveRoomId, tanggal_kegiatan: tgl, hari_kegiatan: getIndonesianDayName(tgl), status_kehadiran: status, keterangan: "" }]); await loadAllFromSupabase(); } else state.db.kehadiran.unshift(nK);
    }
    savePreviewDB();
    state.ustazEvalStep = 3;
    showToast(`Kehadiran ${status} disimpan. Lanjut input setoran.`);
    renderApp();
  };
  window.promptReplaceSetoran = function() { state.ustazForceReplaceMode = true; renderApp(); };

  window.saveUstazSetoranForm = async function() {
    const pid = state.ustazSelectedPesertaId; const roomId = state.ustazActiveRoomId; const tgl = state.selectedDate;
    if(!pid || !roomId) return;
    const surahNo = Number(document.getElementById("ustazSurahSelect").value); const surahObj = getSurahByNo(surahNo);
    const awal = Math.max(1, Number(document.getElementById("ustazAyatAwal").value));
    const akhir = Math.min(surahObj.ayat, Math.max(awal, Number(document.getElementById("ustazAyatAkhir").value)));
    const cat = document.getElementById("ustazCatatanInput").value.trim();

    const existingIdx = state.db.setoran.findIndex(s => s.peserta_id === pid && s.tanggal_kegiatan === tgl && s.status_feedback !== "Menunggu Evaluasi");
    const record = {
      peserta_id: pid, ruang_id: roomId, ustaz_id: state.currentUser.id,
      tanggal_kegiatan: tgl, hari_kegiatan: getIndonesianDayName(tgl), metode: "Offline",
      surah_no: surahNo, nama_surah: surahObj.nama, ayat_awal: awal, ayat_akhir: akhir,
      status_feedback: ustazSelectedStatus, kategori_feedback: [...ustazSelectedCategories],
      catatan_manual: cat, audio_data: (existingIdx >= 0 ? state.db.setoran[existingIdx].audio_data : "")
    };

    if (existingIdx >= 0) {
      const oldId = state.db.setoran[existingIdx].id; state.db.setoran[existingIdx] = { id: oldId, ...record };
      if(HAS_REAL_SUPABASE && supabase) await supabase.from("setoran").update(record).eq("id", oldId);
    } else {
      const nObj = { id: "str-" + Date.now(), ...record };
      if(HAS_REAL_SUPABASE && supabase) { await supabase.from("setoran").insert([record]); await loadAllFromSupabase(); } else state.db.setoran.unshift(nObj);
    }

    const pObj = state.db.peserta.find(p => p.id === pid);
    if (pObj) {
      recomputePesertaProgressFromSetoran(pid);
      // Otomatis melanjutkan dari titik terakhir yang disetor pada pertemuan berikutnya
      if (ustazSelectedStatus === "Lulus") {
        if (akhir < surahObj.ayat) {
          pObj.target_surah = surahNo;
          pObj.target_ayat_awal = akhir + 1;
          pObj.target_ayat_akhir = surahObj.ayat;
        } else {
          const nextSurahNo = surahNo < 114 ? surahNo + 1 : 78;
          const nextSurahObj = getSurahByNo(nextSurahNo);
          pObj.target_surah = nextSurahObj.no;
          pObj.target_ayat_awal = 1;
          pObj.target_ayat_akhir = nextSurahObj.ayat;
        }
      } else {
        pObj.target_surah = surahNo;
        pObj.target_ayat_awal = awal;
        pObj.target_ayat_akhir = akhir;
      }
      if(HAS_REAL_SUPABASE && supabase) await supabase.from("peserta").update({target_surah: pObj.target_surah, target_ayat_awal: pObj.target_ayat_awal, target_ayat_akhir: pObj.target_ayat_akhir, ayat_lulus_json: pObj.ayat_lulus_json, total_ayat_lulus: pObj.total_ayat_lulus}).eq("id", pObj.id);
    }
    state.ustazForceReplaceMode = false; savePreviewDB(); showToast("Evaluasi disimpan!"); renderApp();
  };

    const audioSubmissions = state.db.setoran.filter(s => (s.ustaz_id === ustaz.id || myRoomIds.includes(s.ruang_id)) && (s.audio_data || s.status_feedback === "Menunggu Evaluasi"));

                    ${s.audio_data ? `<div style="margin:10px 0;"><audio controls src="${s.audio_data}" style="width:100%;height:44px;"></audio></div>` : ''}

                    <i class="ri-delete-bin-line"></i> Hapus Rekaman
                  </button>

          }).join("")}

  window.saveEditedUstaz = async function(ustazId) {
    const u = state.db.ustaz.find(x => x.id === ustazId);
    if (!u) return;
    const newNama = (document.getElementById("editUstazNama")?.value || "").trim();
    const newUser = (document.getElementById("editUstazUser")?.value || "").trim();
    const newPass = (document.getElementById("editUstazPass")?.value || "").trim();

    if (!newNama || !newUser || !newPass) {
      return showToast("Nama, Username, dan Password tidak boleh kosong!", true);
    }
    if (newUser.includes("@") || newUser.toLowerCase() === "admin") {
      return showToast("Username Ustaz tidak boleh menggunakan format email (@) atau kata 'admin'!", true);
    }
    const isDup = state.db.ustaz.some(other => other.id !== ustazId && (other.username || "").trim().toLowerCase() === newUser.toLowerCase());
    if (isDup) {
      return showToast(`Username "${newUser}" sudah dipakai oleh Ustaz lain!`, true);
    }

    u.nama_lengkap = newNama;
    u.username = newUser;
    u.password = newPass;

    if (HAS_REAL_SUPABASE && supabase) {
      const { error } = await supabase
        .from("ustaz")
        .update({ nama_lengkap: newNama, username: newUser, password: newPass })
        .eq("id", ustazId);
      if (error) {
        return showToast("Gagal memperbarui di database: " + error.message, true);
      }
      await loadAllFromSupabase();
    }
    savePreviewDB();
    window.closeModal();
    showToast(`Data akun ${newNama} berhasil diperbarui!`);
    renderApp();
  };

  window.adminAddUstazAccount = async function() {
    const gelar = document.getElementById("adminRegGelar")?.value || "Ustaz";
    const nama = (document.getElementById("adminRegNama")?.value || "").trim();
    const userRaw = (document.getElementById("adminRegUser")?.value || "").trim();
    const pass = (document.getElementById("adminRegPass")?.value || "").trim();

    if (!nama || !userRaw || !pass) {
      return showToast("Harap isi Nama Lengkap, Username, dan Password!", true);
    }

    const normalizedUser = userRaw.toLowerCase();
    const cleanNama = nama.replace(/^(ustaz|ustadz|ustazah|ustadzah)\s+/i, "").trim();
    const fullName = `${gelar} ${cleanNama}`;
    const newUstaz = {
      id: "ust-" + Date.now(),
      nama_lengkap: fullName,
      username: userRaw,
      password: pass,
      no_hp: ""
    };

    if (HAS_REAL_SUPABASE && supabase) {
      try {
        const { data: existList, error: fetchErr } = await supabase.from("ustaz").select("*");
        if (!fetchErr && Array.isArray(existList)) {
          state.db.ustaz = existList;
          savePreviewDB();
          if (existList.some(u => (u.username || "").trim().toLowerCase() === normalizedUser)) {
            return showToast(`Ditolak! Username "${userRaw}" sudah terdaftar di sistem.`, true);
          }
        }
        const { data: ins, error: insErr } = await supabase
          .from("ustaz")
          .insert([{ nama_lengkap: fullName, username: userRaw, password: pass, no_hp: "" }])
          .select()
          .single();

        if (insErr) {
          const msg = (insErr.message || "").toLowerCase();
          if (insErr.code === "23505" || msg.includes("duplicate") || msg.includes("unique")) {
            return showToast(`Ditolak! Username "${userRaw}" sudah digunakan.`, true);
          }
          state.db.ustaz.push(newUstaz);
          savePreviewDB();
        } else {
          if (ins) state.db.ustaz.push(ins);
          await loadAllFromSupabase();
          savePreviewDB();
        }
      } catch (e) {
        state.db.ustaz.push(newUstaz);
        savePreviewDB();
      }
    } else {
      const isDup = (state.db.ustaz || []).some(u => (u.username || "").trim().toLowerCase() === normalizedUser);
      if (isDup) {
        return showToast(`Ditolak! Username "${userRaw}" sudah terdaftar.`, true);
      }
      state.db.ustaz.push(newUstaz);
      savePreviewDB();
    }

    showToast(`Akun ${fullName} berhasil ditambahkan!`);
    renderApp();
  };

  window.adminDeleteUstaz = async function(id) {
    const targetUstaz = state.db.ustaz.find(u => u.id === id);
    const roomIds = state.db.ruang_belajar.filter(r => r.ustaz_id === id).map(r => r.id);

    state.db.ustaz = state.db.ustaz.filter(u => u.id !== id);
    state.db.ruang_belajar = state.db.ruang_belajar.filter(r => r.ustaz_id !== id);
    state.db.peserta = state.db.peserta.filter(p => !roomIds.includes(p.ruang_id));
    state.db.setoran = state.db.setoran.filter(s => s.ustaz_id !== id && !roomIds.includes(s.ruang_id));
    state.db.kehadiran = state.db.kehadiran.filter(k => !roomIds.includes(k.ruang_id));

    if (HAS_REAL_SUPABASE && supabase) {
      await supabase.from("ustaz").delete().eq("id", id);
      await loadAllFromSupabase();
    } else {
      savePreviewDB();
    }

    showToast(`Akun ${targetUstaz ? targetUstaz.nama_lengkap : 'Ustaz'} telah dihapus & akses dicabut!`);
    renderApp();
  };

  function toArabicNumber(num) {
    const map = ["٠", "١", "٢", "٣", "٤", "٥", "٦", "٧", "٨", "٩"];
    return String(num).split("").map(c => map[Number(c)] ?? c).join("");
  }

  function stripLeadingBasmalah(arabText, surahNo, nomorAyat) {
    if (!arabText || Number(nomorAyat) !== 1 || Number(surahNo) === 1 || Number(surahNo) === 9) {
      return (arabText || "").trim();
    }
    let text = arabText.trim();
    if (text.includes("\n")) {
      const parts = text.split("\n").map(s => s.trim()).filter(Boolean);
      if (parts.length > 1) return parts.slice(1).join(" ").trim();
    }
    const basmalahPatterns = [
      /^بِسْمِ\s+ٱللَّهِ\s+ٱلرَّحْمَٰنِ\s+ٱلرَّحِيمِ\s*/u,
      /^بِسْمِ\s+اللَّهِ\s+الرَّحْمَٰنِ\s+الرَّحِيمِ\s*/u,
      /^بِسْمِ\s+اللّٰهِ\s+الرَّحْمٰنِ\s+الرَّحِيْمِ\s*/u,
      /^بِسْمِ\s+ٱللّٰهِ\s+ٱلرَّحْمٰنِ\s+ٱلرَّحِيْمِ\s*/u
    ];
    for (const pat of basmalahPatterns) {
      if (pat.test(text)) {
        const cleaned = text.replace(pat, "").trim();
        if (cleaned.length > 0) return cleaned;
      }
    }
    const words = text.split(/\s+/);
    if (words.length > 4) {
      const firstWordNorm = words[0].replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/gu, "");
      const fourthWordNorm = words[3].replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/gu, "");
      if (firstWordNorm.includes("بسم") && (fourthWordNorm.includes("الرحيم") || fourthWordNorm.includes("ٱلرحيم"))) {
        return words.slice(4).join(" ").trim();
      }
    }
    return text;
  }

  function formatArabicWithWaqaf(arabicText, nomorAyat) {
    if (!arabicText) return "";
    const waqafMap = {
      "\u06D6": { title: "Waqaf Shala (صلى): Lebih utama disambung (washal), boleh berhenti", cls: "" },
      "\u06D7": { title: "Waqaf Qala (قلى): Lebih utama berhenti (waqaf)", cls: "waqaf-stop" },
      "\u06D8": { title: "Waqaf Lazim (مـ): Harus berhenti", cls: "waqaf-stop" },
      "\u06D9": { title: "Waqaf Laa (لا): Jangan berhenti kecuali di akhir ayat", cls: "waqaf-no" },
      "\u06DA": { title: "Waqaf Jaiz (ج): Boleh berhenti atau disambung", cls: "" },
      "\u06DB": { title: "Waqaf Mu'anaqah (ۛ): Berhenti pada salah satu tanda titik tiga saja", cls: "waqaf-stop" }
    };

    const cleaned = arabicText.replace(/\r?\n/g, " ").trim();
    const regex = /(\s*[\u06D6-\u06DB])/gu;
    const formatted = cleaned.replace(regex, (match) => {
      const ch = match.trim();
      const info = waqafMap[ch];
      if (!info) return match;
      return `<span class="waqaf-mark ${info.cls}" title="${info.title}">${match}</span>`;
    });

    return `${formatted} <span class="ayah-end-badge" title="Akhir Ayat ${nomorAyat}">﴿${toArabicNumber(nomorAyat)}﴾</span>`;
  }

  function highlightTranslationText(text, query) {
    if (!query || !text) return text;
    const q = query.trim();
    if (!q || /^\d+(-\d+)?$/.test(q)) return text;
    const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return text.replace(new RegExp(`(${escaped})`, "gi"), `<mark class="search-highlight">$1</mark>`);
  }

        <div style="text-align:center;padding:28px;color:var(--text-muted);">
          <i class="ri-loader-4-line" style="font-size:1.8rem;color:var(--primary-dark);"></i>
          <p style="margin-top:8px;font-weight:700;">Memuat teks Mushaf & terjemahan QS. ${surahMeta.nama}...</p>
        </div>
      </div>
    `;

    await loadAndRenderMushafAyahs(currentSurahNo);
  }

  async function fetchSurahData(surahNo) {
    if (state.mushafCache[surahNo]) return state.mushafCache[surahNo];

    try {
      const resEq = await fetch(`https://equran.id/api/v2/surat/${surahNo}`);
      if (resEq.ok) {
        const jsonEq = await resEq.json();
        if (jsonEq?.data?.ayat && Array.isArray(jsonEq.data.ayat)) {
          const mapped = jsonEq.data.ayat.map(item => ({
            no: Number(item.nomorAyat),
            arab: stripLeadingBasmalah(item.teksArab, surahNo, item.nomorAyat),
            terjemahan: item.teksIndonesia
          }));
          state.mushafCache[surahNo] = mapped;
          return mapped;
        }
      }
    } catch (e) {}

    try {
      const resCloud = await fetch(`https://api.alquran.cloud/v1/surah/${surahNo}/editions/quran-uthmani,id.indonesian`);
      if (resCloud.ok) {
        const jsonCloud = await resCloud.json();
        const arabEdition = jsonCloud?.data?.[0]?.ayahs || [];
        const indoEdition = jsonCloud?.data?.[1]?.ayahs || [];
        if (arabEdition.length > 0) {
          const mapped = arabEdition.map((a, idx) => ({
            no: Number(a.numberInSurah),
            arab: stripLeadingBasmalah(a.text, surahNo, a.numberInSurah),
            terjemahan: indoEdition[idx]?.text || ""
          }));
          state.mushafCache[surahNo] = mapped;
          return mapped;
        }
      }
    } catch (e) {}

    return [];
  }

  async function loadAndRenderMushafAyahs(surahNo) {
    const box = document.getElementById("mushafAyahContainer");
    if (!box) return;

    const ayahs = await fetchSurahData(surahNo);
    if (!ayahs || ayahs.length === 0) {
      box.innerHTML = `<div style="text-align:center;padding:24px;color:var(--danger);font-weight:700;">Gagal memuat teks surah. Pastikan koneksi internet aktif.</div>`;
      return;
    }

    const q = (state.mushafAyatSearch || "").trim();
    let filtered = ayahs;

    if (q) {
      const rangeMatch = q.match(/^(\d+)\s*-\s*(\d+)$/);
      if (rangeMatch) {
        const start = Number(rangeMatch[1]);
        const end = Number(rangeMatch[2]);
        filtered = ayahs.filter(a => a.no >= Math.min(start, end) && a.no <= Math.max(start, end));
      } else if (/^\d+$/.test(q)) {
        const targetNo = Number(q);
        filtered = ayahs.filter(a => a.no === targetNo);
      } else {
        const lower = q.toLowerCase();
        filtered = ayahs.filter(a => (a.terjemahan || "").toLowerCase().includes(lower) || String(a.no).includes(lower));
      }
    }

    if (filtered.length === 0) {
      box.innerHTML = `<div style="text-align:center;padding:24px;color:var(--text-muted);font-weight:700;">Tidak ditemukan ayat yang cocok dengan pencarian "${q}".</div>`;
      return;
    }

    box.innerHTML = filtered.map(a => `
      <div style="padding:18px 14px;border-bottom:1px solid #e2e8f0;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <span class="badge badge-lulus">Ayat ${a.no}</span>
        </div>
        <div class="font-arabic" style="text-align:right;margin-bottom:12px;">
          ${formatArabicWithWaqaf(a.arab, a.no)}
        </div>
        <p style="font-size:0.88rem;color:#334155;line-height:1.6;">
          ${highlightTranslationText(a.terjemahan, q)}
        </p>
      </div>
    `).join("");
  }

  window.selectMushafSurah = async function(no) {
    state.selectedSurahMushaf = Number(no);
    const surahMeta = getSurahByNo(state.selectedSurahMushaf);

    const dropdown = document.getElementById("mushafSurahDropdown");
    if (dropdown) dropdown.value = String(state.selectedSurahMushaf);

    const pillBar = document.getElementById("mushafSurahPillBar");
    if (pillBar) pillBar.innerHTML = buildSurahPillBarHTML();

    const headerCard = document.getElementById("mushafBasmalahHeader");
    if (headerCard) {
      headerCard.innerHTML = `
        <div style="font-size:0.78rem;font-weight:800;color:var(--primary-dark);margin-bottom:4px;">
          QS. ${surahMeta.nama.toUpperCase()} (${surahMeta.arti}) • SURAH KE-${surahMeta.no} • ${surahMeta.ayat} AYAT
        </div>
        <div class="basmalah-arabic">بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ</div>
        <div class="basmalah-latin">Dengan nama Allah Yang Maha Pengasih, Maha Penyayang.</div>
      `;
    }

    const box = document.getElementById("mushafAyahContainer");
    if (box) {
      box.innerHTML = `
        <div style="text-align:center;padding:28px;color:var(--text-muted);">
          <i class="ri-loader-4-line" style="font-size:1.8rem;color:var(--primary-dark);"></i>
          <p style="margin-top:8px;font-weight:700;">Memuat teks Mushaf & terjemahan QS. ${surahMeta.nama}...</p>
        </div>
      `;
    }
    await loadAndRenderMushafAyahs(state.selectedSurahMushaf);
  };

  window.toggleWaqafGuide = function() {
    state.mushafShowWaqafGuide = !state.mushafShowWaqafGuide;
    renderApp();
  };

  window.handleMushafSurahSearch = function(val) {
    state.mushafSurahSearch = val;
    const pillBar = document.getElementById("mushafSurahPillBar");
    if (pillBar) {
      pillBar.innerHTML = buildSurahPillBarHTML();
    }
  };

  window.handleMushafAyatSearch = function(val) {
    state.mushafAyatSearch = val;
    loadAndRenderMushafAyahs(state.selectedSurahMushaf);
  };

  window.toggleRegisterUstaz = function(show) {
    state.showRegisterUstaz = Boolean(show);
    renderApp();
  };

  function renderApp() {
    if (state.role === "ustaz" && state.currentUser?.id) {
      const stillExists = (state.db.ustaz || []).some(u => u.id === state.currentUser.id);
      if (!stillExists) {
        state.role = "public";
        state.currentUser = null;
        state.activeMenu = "beranda";
        showToast("Sesi berakhir: Akun Ustaz telah dihapus oleh Admin.", true);
      }
    }

    renderNavigation();
    const container = document.getElementById("mainViewContainer");
    if (!container) return;

    const menu = state.activeMenu;

    if (menu === "mushaf") {
      renderMushafJuz30(container);
      return;
    }

    if (state.role === "public") {
      if (menu === "beranda") renderPublicBeranda(container);
      else if (menu === "input_kode_ruang") renderPublicInputKode(container);
      else if (menu === "ruang_publik") renderPublicRoomView(container);
      else if (menu === "setor_hafalan") renderPublicSetorHafalan(container);
      else if (menu === "materi_publik") renderPublicMateri(container);
      else if (menu === "login") renderLoginPortal(container);
      else if (menu === "login_admin") renderLoginAdmin(container);
      else renderPublicBeranda(container);
      return;
    }

    if (state.role === "ustaz") {
      if (menu === "ustaz_ringkasan") renderUstazRingkasan(container);
      else if (menu === "ustaz_setoran_audio") renderUstazSetoranAudio(container);
      else renderUstazRingkasan(container);
      return;
    }

    if (state.role === "admin") {
      if (menu === "admin_overview") renderAdminOverview(container);
      else if (menu === "admin_ustaz") renderAdminUstaz(container);
      else if (menu === "admin_ruang") renderAdminRuangPeserta(container);
      else if (menu === "admin_materi") renderAdminMateri(container);
      else if (menu === "admin_log") renderAdminLogData(container);
      else renderAdminOverview(container);
    }
  }

  (async function initMurajaahkuApp() {
    await autoSetupDatabase();
    renderApp();
  })();
</script>
</body>
</html>
